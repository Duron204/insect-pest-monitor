<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f1712">
    <meta name="description" content="病虫害智能监测系统 —— 图像 / 批量 / 视频 / 摄像头实时虫害检测与统计">
    <title>病虫害智能监测系统</title>
    <script>
      // 在 JS 包加载前先把主题落到 <html>：浅色用户不再看到深色闪一下，
      // 深色用户不再看到白屏闪一下。与 stores/ui.ts 的 THEME_KEY 保持一致。
      try {
        if (localStorage.getItem('ip_theme') === 'light') {
          document.documentElement.setAttribute('data-theme', 'light')
        } else {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      } catch (e) { /* 隐私模式等场景：默认深色 */ }
    </script>
    <style>
      /* 初始背景跟随主题，避免首帧白闪（与 tokens.scss 的 --ip-bg 一致） */
      html { background: #0f1712; }
      html[data-theme='light'] { background: #f2f5f1; }

      /* JS 包加载期间（树莓派上首开约 1-3 秒）的启动占位，Vue mount 时自动被替换 */
      .boot { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; height: 100vh; color: #a9bdb0; font: 13px/1.5 'Segoe UI', 'Microsoft YaHei', sans-serif; }
      .boot svg { opacity: .9; }
      .boot-bar { width: 120px; height: 3px; border-radius: 3px; background: #26372c; overflow: hidden; }
      .boot-bar::after { content: ''; display: block; width: 40%; height: 100%; border-radius: 3px; background: #2f9e5f; animation: boot-slide 1.1s ease-in-out infinite; }
      @keyframes boot-slide { 0% { transform: translateX(-120%); } 100% { transform: translateX(300%); } }
      @media (prefers-reduced-motion: reduce) { .boot-bar::after { animation: none; } }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none">
          <path d="M12 21c0-5 1.5-9 6-12M12 21c0-5-1.5-9-6-12M12 21v-6" stroke="#2f9e5f" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M12 9c2.6 0 4.6-1.6 5.4-4.2C14.6 4 12.6 5.6 12 8.2M12 9C9.4 9 7.4 7.4 6.6 4.8 9.4 4 11.4 5.6 12 8.2" stroke="#2f9e5f" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        <div>正在启动监测系统…</div>
        <div class="boot-bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
